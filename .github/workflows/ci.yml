name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aliran:ci .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name aliran -p 3000:3000 \
            -e DATA_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e PUBLIC_ORIGIN=https://ci.example.invalid aliran:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 1; done
          docker logs aliran; exit 1
