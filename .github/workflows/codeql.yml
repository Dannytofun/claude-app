name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # weekly, to catch newly published vulnerability patterns

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning is free only on public repositories (private ones need GitHub Advanced Security),
    # so skip instead of failing. Runs automatically if the repository is made public.
    # Scheduled runs carry no repository details, so they are skipped too; push and pull request scans still run.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
