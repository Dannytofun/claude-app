/* ============ modals ============ */
function openModal(title, body, foot, onMount){
  const root = $('#modalRoot');
  root.innerHTML = `<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="modal-h"><h2 id="mTitle">${title}</h2><button class="iconbtn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="modal-b">${body}</div><div class="modal-f">${foot}</div></div></div>`;
  const scrim = $('#scrim');
  scrim.addEventListener('mousedown', e => { if (e.target === scrim) closeModal(); });
  $$('[data-close]', root).forEach(b => b.addEventListener('click', closeModal));
  if (onMount) onMount(root);
  const first = $('input:not([readonly]),select,textarea', $('.modal-b', root)) || $('.modal-f button', root);
  if (first) setTimeout(() => first.focus(), 30);
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#scrim')) closeModal(); });
function confirmModal(title, msg, okLabel, onOk, danger){
  openModal(esc(title), `<p style="margin:0">${msg}</p>`, `<button class="btn" data-close>Cancel</button><button class="btn ${danger ? 'danger solid' : 'primary'}" id="cOk">${esc(okLabel)}</button>`, root => {
    $('#cOk', root).addEventListener('click', () => { closeModal(); onOk(); });
  });
}
let toastT;
function toast(msg){
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600);
}

/* ---- transaction form ---- */
function catOptions(type, sel){
  const list = type === 'income' ? INCOME_CATS : S.categories;
  return `<option value="">Choose…</option>` + list.map(c => `<option ${c === sel ? 'selected' : ''}>${esc(c)}</option>`).join('');
}
function openTxForm(existing, ctx = {}){
  const p = ctx.parsed || {};
  const t = existing ? clone(existing) : {type:p.type || 'expense', amount:p.amount ?? '', date:p.date || (ctx.fromFile ? '' : todayISO()), merchant:p.merchant || '', reference:p.reference || '', notes:'', category:p.category || '', sourceFile:ctx.sourceFile || '', payslip:p.payslip || null, goalId:''};
  let sugg = {cat:'', why:''};
  if (!existing && t.type === 'expense') { sugg = suggestCategory(t.merchant, ctx.raw); t.category = sugg.cat; }
  const isPay = !!t.payslip;
  const miss = v => ctx.fromFile && (v === '' || v == null) ? 'missing' : '';
  const ps = t.payslip || {};
  const numIn = (id, label, val, extra = '') => `<label class="f">${label}<input class="in tnum ${miss(val)}" type="number" step="0.01" min="0" inputmode="decimal" id="${id}" value="${val ?? ''}" ${extra}></label>`;
  let banner = '';
  const billPay = existing && existing.billId && S.billPayments.find(x => x.transactionId === existing.id);
  const billOf = billPay && S.bills.find(x => x.id === billPay.billId);
  if (billOf) banner = `<div class="note">This is the payment for <b>${esc(billOf.name)}</b>, ${monthLabel(billPay.month, true)} bill. Changing the amount or date updates that bill too; it stays marked paid for ${monthLabel(billPay.month, true)}.</div>`;
  if (ctx.fromFile) {
    if (ctx.err) banner = `<div class="note bad"><b>Couldn't read ${esc(ctx.sourceFile)} automatically.</b> ${esc(ctx.err)} ${/load|unavailable|responding/i.test(ctx.err) ? 'Text recognition needs an internet connection the first time and may be blocked inside some embedded viewers; opening the app file directly in Chrome, Edge or Firefox usually fixes this.' : ''} Fill in the details below by hand.</div>`;
    else { const found = isPay ? [ps.gross, ps.net ?? t.amount, ps.epf, ps.socso, ps.eis, ps.pcb, ps.period, t.date].filter(x => x != null && x !== '').length : [t.amount, t.date, t.merchant, t.reference].filter(x => x != null && x !== '').length; const of = isPay ? 8 : 4;
      banner = `<div class="note ${found < of ? 'warn' : ''}">Read with ${esc(ctx.method)}: found ${found} of ${of} fields. ${found < of ? 'Fields shaded amber were not found; fill them in or leave them blank.' : 'Please check each value before saving.'}</div>`; }
  }
  const body = `${banner}
    <div class="form-grid">
      <label class="f">Type<select class="in" id="tType">${[['expense','Expense'],['income','Income'],['savings','Savings transfer']].map(([k, l]) => `<option value="${k}" ${t.type === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      ${numIn('tAmt', (isPay ? 'Net pay (recorded as income)' : 'Amount') + ' (' + esc(S.settings.currency) + ')', t.amount === '' ? '' : t.amount, 'required')}
      <label class="f">Date<input class="in ${miss(t.date)}" type="date" id="tDate" value="${esc(t.date)}" required></label>
      <label class="f" id="tCatWrap">Category<select class="in" id="tCat">${catOptions(t.type, t.category)}</select><span class="hint" id="tCatWhy">${sugg.cat ? 'Suggested from ' + esc(sugg.why) : ''}</span></label>
      <label class="f" id="tGoalWrap" hidden>Goal<select class="in" id="tGoal"><option value="">General savings</option>${S.goals.map(g => `<option value="${g.id}" ${t.goalId === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></label>
      <label class="f full"><span id="tMerchLbl">Payee / merchant</span><input class="in ${miss(t.merchant)}" id="tMerch" value="${esc(t.merchant)}" autocomplete="off"></label>
      <label class="f">Reference no.<input class="in ${isPay ? '' : miss(t.reference)}" id="tRef" value="${esc(t.reference)}"></label>
      <label class="f">Source file<input class="in" id="tFile" value="${esc(t.sourceFile)}" readonly placeholder="None"></label>
      <label class="f full">Notes<input class="in" id="tNotes" value="${esc(t.notes)}"></label>
    </div>
    ${isPay ? `<div><div class="eyebrow" style="margin-bottom:8px">Payslip details</div><div class="form-grid">
      ${numIn('pGross', 'Gross pay', ps.gross)}
      <label class="f">Pay period<input class="in ${miss(ps.period)}" type="month" id="pPeriod" value="${esc(ps.period || '')}"></label>
      ${numIn('pEpf', 'EPF / KWSP', ps.epf)}${numIn('pSocso', 'SOCSO / PERKESO', ps.socso)}${numIn('pEis', 'EIS / SIP', ps.eis)}${numIn('pPcb', 'PCB / income tax', ps.pcb)}
    </div><p class="hint" id="pCalc" style="margin:8px 0 0"></p></div>` : ''}
    ${ctx.raw ? `<details class="raw"><summary>Show the text that was read</summary><pre>${esc(ctx.raw.slice(0, 4000))}</pre></details>` : ''}`;
  const foot = `${existing ? `<button class="btn danger" id="tDel" style="margin-right:auto">Delete</button>` : ''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="tSave">${existing ? 'Save changes' : 'Save transaction'}</button>`;
  openModal(existing ? 'Edit transaction' : ctx.fromFile ? (isPay ? 'Check payslip details' : 'Check receipt details') : 'New transaction', body, foot, root => {
    const typeSel = $('#tType'), catSel = $('#tCat');
    const sync = () => {
      const ty = typeSel.value;
      $('#tCatWrap').hidden = ty === 'savings'; $('#tGoalWrap').hidden = ty !== 'savings';
      $('#tMerchLbl').textContent = ty === 'income' ? 'Source / employer' : ty === 'savings' ? 'Description' : 'Payee / merchant';
    };
    typeSel.addEventListener('change', () => { catSel.innerHTML = catOptions(typeSel.value, typeSel.value === 'income' ? 'Salary' : ''); sync(); });
    sync();
    $('#tMerch').addEventListener('change', () => { if (typeSel.value !== 'expense') return; const s = suggestCategory($('#tMerch').value, ''); if (s.cat) { catSel.value = s.cat; $('#tCatWhy').textContent = 'Suggested from ' + s.why; } });
    $$('.in.missing', root).forEach(i => i.addEventListener('input', () => i.classList.toggle('missing', !i.value)));
    if (isPay) {
      const calc = () => {
        const g = +$('#pGross').value || 0; const d = ['#pEpf','#pSocso','#pEis','#pPcb'].reduce((a, s) => a + (+$(s).value || 0), 0);
        const el = $('#pCalc');
        if (g && d) { const n = round2(g - d); el.innerHTML = `Gross minus deductions = <b>${money(n)}</b>${Math.abs(n - (+$('#tAmt').value || 0)) > 0.01 ? ` <button class="btn sm" type="button" id="useCalc">Use as net pay</button>` : ' ✓ matches net pay'}`; const u = $('#useCalc'); if (u) u.onclick = () => { $('#tAmt').value = n.toFixed(2); $('#tAmt').classList.remove('missing'); calc(); }; }
        else el.textContent = '';
      };
      ['#pGross','#pEpf','#pSocso','#pEis','#pPcb','#tAmt'].forEach(s => $(s).addEventListener('input', calc)); calc();
    }
    if (existing) $('#tDel').addEventListener('click', () => { closeModal(); deleteTx(existing.id); });
    $('#tSave').addEventListener('click', () => {
      const amt = round2($('#tAmt').value), date = $('#tDate').value, ty = typeSel.value;
      const errs = [];
      if (!(amt > 0)) errs.push('an amount above zero'); if (!date) errs.push('a date');
      if (ty !== 'savings' && !catSel.value) errs.push('a category');
      if (errs.length) { toast('Please add ' + errs.join(', ') + '.'); (!(amt > 0) ? $('#tAmt') : !date ? $('#tDate') : catSel).focus(); return; }
      const rec = existing ? S.transactions.find(x => x.id === existing.id) : {id:uid(), createdAt:new Date().toISOString()};
      Object.assign(rec, {type:ty, amount:amt, date, category:ty === 'savings' ? 'Savings' : catSel.value, merchant:$('#tMerch').value.trim(), reference:$('#tRef').value.trim(), notes:$('#tNotes').value.trim(), sourceFile:$('#tFile').value});
      rec.goalId = ty === 'savings' ? $('#tGoal').value : undefined;
      if (isPay && ty === 'income') rec.payslip = {gross:round2($('#pGross').value) || null, epf:round2($('#pEpf').value) || null, socso:round2($('#pSocso').value) || null, eis:round2($('#pEis').value) || null, pcb:round2($('#pPcb').value) || null, period:$('#pPeriod').value || ''};
      // remember category corrections
      if (ty === 'expense' && rec.merchant) {
        const kwOnly = (() => { const keep = S.settings.merchantCategoryMap[normMerchant(rec.merchant)]; delete S.settings.merchantCategoryMap[normMerchant(rec.merchant)]; const s = suggestCategory(rec.merchant, ''); if (keep) S.settings.merchantCategoryMap[normMerchant(rec.merchant)] = keep; return s.cat; })();
        if (rec.category !== kwOnly) S.settings.merchantCategoryMap[normMerchant(rec.merchant)] = rec.category;
        else delete S.settings.merchantCategoryMap[normMerchant(rec.merchant)];
      }
      // keep the bill payment in step with its transaction; it still pays the same month's bill even if paid late
      if (rec.billId) { const p = S.billPayments.find(x => x.transactionId === rec.id); if (p) { p.actualAmount = rec.amount; p.paidDate = rec.date; } }
      if (!existing) S.transactions.push(rec);
      save(); closeModal();
      if (txMonth(rec) !== ui.month && ui.tab !== 'transactions') ui.month = txMonth(rec);
      render(); toast(existing ? 'Transaction updated' : 'Saved ' + money(rec.amount) + (rec.merchant ? ' · ' + rec.merchant : ''));
      if (!existing && ty === 'income' && (isPay || rec.category === 'Salary')) setTimeout(() => offerPayYourself(rec), 250);
    });
  });
}
function deleteTx(id){
  const t = S.transactions.find(x => x.id === id); if (!t) return;
  const bill = t.billId && S.bills.find(b => b.id === t.billId);
  confirmModal('Delete transaction?', `${esc(t.merchant || t.type)} · ${money(t.amount)} on ${fmtDate(t.date)}.${bill ? ` This also marks <b>${esc(bill.name)}</b> as unpaid for that month.` : ''} This can't be undone.`, 'Delete', () => {
    S.transactions = S.transactions.filter(x => x.id !== id);
    S.billPayments = S.billPayments.filter(p => p.transactionId !== id);
    save(); render(); toast('Transaction deleted');
  }, true);
}
function offerPayYourself(inc){
  const amt = suggestedSavings(inc.amount);
  if (!(amt > 0)) return;
  const rule = S.settings.savingsMode === 'percent' ? S.settings.savingsPercent + '% of your net pay' : 'your fixed monthly amount';
  openModal('Pay yourself first', `<p style="margin:0">Set aside <b>${money(amt)}</b> to savings now? That's ${esc(rule)}, moved before any spending.</p>
    <div class="form-grid"><label class="f">Amount (${esc(S.settings.currency)})<input class="in tnum" type="number" step="0.01" min="0" id="pyAmt" value="${amt.toFixed(2)}"></label>
    <label class="f">Goal<select class="in" id="pyGoal"><option value="">General savings</option>${S.goals.map((g, i) => `<option value="${g.id}" ${i === 0 ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></label></div>`,
    `<button class="btn" data-close>Not this time</button><button class="btn primary" id="pyOk">Move to savings</button>`, root => {
      $('#pyOk', root).addEventListener('click', () => {
        const a = round2($('#pyAmt').value); if (!(a > 0)) { toast('Enter an amount above zero.'); return; }
        const g = $('#pyGoal').value;
        S.transactions.push({id:uid(), type:'savings', amount:a, date:inc.date, category:'Savings', merchant:'Pay yourself first', goalId:g || undefined, reference:'', notes:'From pay on ' + fmtDate(inc.date), sourceFile:'', createdAt:new Date().toISOString()});
        save(); closeModal(); render(); toast(money(a) + ' moved to savings');
      });
    });
}

    <label class="f">First month<input class="in" type="month" id="bStart" value="${esc(x.startMonth || ui.month)}"></label>
    ${b ? '' : `<label class="full row" id="bPaidWrap" hidden style="font-size:.9rem;gap:8px"><input type="checkbox" id="bPaidNow"> <span id="bPaidLbl">I've already paid this month's bill</span></label>`}
  </div>`, `${b ? `<button class="btn danger" id="bDel" style="margin-right:auto">Delete bill</button>` : ''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="bSave">${b ? 'Save changes' : 'Add bill'}</button>`, root => {
    $('#bName').addEventListener('change', () => { if (b) return; const s = suggestCategory($('#bName').value, ''); if (s.cat) $('#bCat').value = s.cat; });
    // New bill whose first due date has already passed: offer "already paid" so it doesn't start out Overdue
    const firstDuePassed = () => {
      const m = $('#bStart').value, day = Math.round(+$('#bDay').value);
      if (!/^\d{4}-\d{2}$/.test(m) || !(day >= 1 && day <= 31)) return false;
      return billDueDate({dueDay:day}, m) < todayDate();
    };
    const syncPaid = () => {
      const w = $('#bPaidWrap'); if (!w) return;
      w.hidden = !firstDuePassed();
      if (!w.hidden) $('#bPaidLbl').textContent = `I've already paid the ${monthLabel($('#bStart').value, true)} bill (due ${fmtDate(toISO(billDueDate({dueDay:Math.round(+$('#bDay').value)}, $('#bStart').value)))})`;
    };
    if (!b) { ['#bDay', '#bStart'].forEach(s => $(s).addEventListener('input', syncPaid)); syncPaid(); }
    if (b) $('#bDel').addEventListener('click', () => { closeModal(); confirmModal('Delete this bill?', `<b>${esc(b.name)}</b> stops appearing each month. Past payment transactions stay in your history.`, 'Delete bill', () => {
      S.bills = S.bills.filter(y => y.id !== b.id); S.billPayments = S.billPayments.filter(p => p.billId !== b.id);
      S.transactions.forEach(t => { if (t.billId === b.id) t.billId = undefined; });
      save(); render(); toast('Bill deleted'); }, true); });
    $('#bSave').addEventListener('click', () => {
      const name = $('#bName').value.trim(), amt = round2($('#bAmt').value), day = Math.round(+$('#bDay').value);
      if (!name) { toast('Give the bill a name.'); $('#bName').focus(); return; }
      if (!(amt > 0)) { toast('Enter an amount above zero (an estimate is fine).'); $('#bAmt').focus(); return; }
      if (!(day >= 1 && day <= 31)) { toast('Due day must be between 1 and 31.'); $('#bDay').focus(); return; }
      const rec = b ? S.bills.find(y => y.id === b.id) : {id:uid()};
      Object.assign(rec, {name, category:$('#bCat').value || 'Other', amount:amt, isVariable:$('#bVar').value === '1', dueDay:day, frequency:$('#bFreq').value, startMonth:$('#bStart').value || ui.month});
      if (!b) S.bills.push(rec);
      // Paid before tracking began: mark that month paid without adding an expense (the money left before Aliran knew about it)
      if (!b && $('#bPaidWrap') && !$('#bPaidWrap').hidden && $('#bPaidNow').checked && billDueIn(rec, rec.startMonth)) {
        S.billPayments.push({billId:rec.id, month:rec.startMonth, paidDate:toISO(billDueDate(rec, rec.startMonth)), actualAmount:rec.amount, transactionId:null, createdTx:false, beforeTracking:true});
      }
      save(); closeModal(); render(); toast(b ? 'Bill updated' : 'Bill added');
    });
  });
}
function openPay(billId, m){
  const b = S.bills.find(x => x.id === billId); if (!b) return;
  const due = toISO(billDueDate(b, m));
  const defDate = m === curYM() ? todayISO() : (due < todayISO() ? due : todayISO());
  const linked = new Set(S.billPayments.map(p => p.transactionId));
  const cands = S.transactions.filter(t => t.type === 'expense' && !t.billId && !linked.has(t.id) && Math.abs(monthDiff(m, txMonth(t))) <= 1)
    .map(t => ({t, score:(t.category === b.category ? 2 : 0) + (normMerchant(b.name).split(' ').some(w => w.length > 2 && normMerchant(t.merchant).includes(w)) ? 3 : 0) + (txMonth(t) === m ? 1 : 0)}))
    .sort((a, c) => c.score - a.score || c.t.date.localeCompare(a.t.date)).slice(0, 25);
  openModal('Mark ' + esc(b.name) + ' as paid', `<p class="ink2" style="margin:0">${monthLabel(m, true)} · due ${fmtDate(due)}${b.isVariable ? ' · variable bill, enter what you actually paid' : ''}</p>
    <div class="form-grid">
      <label class="f full">Payment record<select class="in" id="pLink"><option value="">Create a new expense for this payment</option>${cands.map(({t}) => `<option value="${t.id}">Use receipt: ${esc(fmtShort(t.date))} · ${esc(t.merchant || t.category)} · ${money(t.amount)}${t.sourceFile ? ' 📎' : ''}</option>`).join('')}</select><span class="hint">Already uploaded the receipt? Link it so the payment isn't counted twice.</span></label>
      <label class="f">${b.isVariable ? 'Actual amount' : 'Amount'} (${esc(S.settings.currency)})<input class="in tnum" type="number" step="0.01" min="0" id="pAmt" value="${b.isVariable ? '' : b.amount}" placeholder="${b.isVariable ? 'Estimate ' + b.amount : ''}"></label>
      <label class="f">Paid on<input class="in" type="date" id="pDate" value="${defDate}"></label>
    </div>`, `<button class="btn" data-close>Cancel</button><button class="btn primary" id="pOk">Mark as paid</button>`, root => {
      $('#pLink').addEventListener('change', () => { const t = S.transactions.find(x => x.id === $('#pLink').value); const on = !!t; $('#pAmt').disabled = on; $('#pDate').disabled = on; if (t) { $('#pAmt').value = t.amount; $('#pDate').value = t.date; } });
      $('#pOk').addEventListener('click', () => {
        const linkId = $('#pLink').value;
        let t;
        if (linkId) { t = S.transactions.find(x => x.id === linkId); t.billId = b.id; t.category = b.category; }
        else {
          const amt = round2($('#pAmt').value), date = $('#pDate').value;
          if (!(amt > 0)) { toast('Enter the amount you paid.'); $('#pAmt').focus(); return; }
          if (!date) { toast('Enter the payment date.'); return; }
          t = {id:uid(), type:'expense', amount:amt, date, category:b.category, merchant:b.name, reference:'', notes:'Bill payment · ' + monthLabel(m), sourceFile:'', billId:b.id, createdAt:new Date().toISOString()};
          S.transactions.push(t);
        }
        if (b.isVariable && !linkId) b.amount = round2(t.amount);
        S.billPayments.push({billId:b.id, month:m, paidDate:t.date, actualAmount:t.amount, transactionId:t.id, createdTx:!linkId});
        save(); closeModal(); render(); toast(b.name + ' marked as paid');
      });
    });
}
function unpay(billId, m){
  const p = S.billPayments.find(x => x.billId === billId && x.month === m); if (!p) return;
  const b = S.bills.find(x => x.id === billId);
  confirmModal('Mark as unpaid?', p.createdTx ? `This removes the ${money(p.actualAmount)} expense that was recorded for <b>${esc(b.name)}</b>.` : `The linked receipt stays in Transactions but is no longer tied to <b>${esc(b.name)}</b>.`, 'Mark unpaid', () => {
    S.billPayments = S.billPayments.filter(x => x !== p);
    if (p.createdTx) S.transactions = S.transactions.filter(t => t.id !== p.transactionId);
    else { const t = S.transactions.find(x => x.id === p.transactionId); if (t) t.billId = undefined; }
    save(); render(); toast('Marked as unpaid');
  });
}

/* ---- goals ---- */
function openGoalForm(g){
  const x = g || {name:'', target:'', savedAmount:0};
  openModal(g ? 'Edit goal' : 'New savings goal', `<div class="form-grid">
    <label class="f full">Goal name<input class="in" id="gName" value="${esc(x.name)}" placeholder="e.g. Emergency fund"></label>
    <label class="f">Target (${esc(S.settings.currency)})<input class="in tnum" type="number" min="0" step="100" id="gTarget" value="${x.target}"></label>
    <label class="f">Already saved before using Aliran<input class="in tnum" type="number" min="0" step="0.01" id="gBase" value="${x.savedAmount || 0}"></label>
  </div>`, `${g ? `<button class="btn danger" id="gDel" style="margin-right:auto">Delete goal</button>` : ''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="gSave">${g ? 'Save' : 'Create goal'}</button>`, () => {
    if (g) $('#gDel').addEventListener('click', () => { closeModal(); confirmModal('Delete goal?', `Savings transfers to <b>${esc(g.name)}</b> stay in Transactions as general savings.`, 'Delete goal', () => {
      S.goals = S.goals.filter(y => y.id !== g.id); S.transactions.forEach(t => { if (t.goalId === g.id) t.goalId = undefined; }); save(); render(); }, true); });
    $('#gSave').addEventListener('click', () => {
      const name = $('#gName').value.trim(), target = round2($('#gTarget').value);
      if (!name || !(target > 0)) { toast('Add a name and a target above zero.'); return; }
      const rec = g ? S.goals.find(y => y.id === g.id) : {id:uid()};
      Object.assign(rec, {name, target, savedAmount:round2($('#gBase').value)});
      if (!g) S.goals.push(rec);
      save(); closeModal(); render();
    });
  });
}
function openContrib(gid){
  const g = S.goals.find(x => x.id === gid); if (!g) return;
  openModal('Add savings to ' + esc(g.name), `<div class="form-grid"><label class="f">Amount (${esc(S.settings.currency)})<input class="in tnum" type="number" min="0" step="0.01" id="cAmt"></label><label class="f">Date<input class="in" type="date" id="cDate" value="${todayISO()}"></label></div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="cOk2">Add</button>`, () => {
      $('#cOk2').addEventListener('click', () => {
        const a = round2($('#cAmt').value), d = $('#cDate').value;
        if (!(a > 0) || !d) { toast('Enter an amount and a date.'); return; }
        S.transactions.push({id:uid(), type:'savings', amount:a, date:d, category:'Savings', merchant:'Transfer to ' + g.name, goalId:g.id, reference:'', notes:'', sourceFile:'', createdAt:new Date().toISOString()});
        save(); closeModal(); render(); toast(money(a) + ' added to ' + g.name);
      });
    });
}

/* ---- export / import ---- */
function offerFile(filename, text, mime){
  let started = false;
  try { const url = URL.createObjectURL(new Blob([text], {type:mime})); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); started = true; setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500); } catch (e) {}
  openModal('Export ready', `<p style="margin:0">${started ? `Your browser should be saving <b>${esc(filename)}</b>. If no file appears (some embedded viewers block downloads), copy the text below and save it in a file named <b>${esc(filename)}</b>.` : `Copy the text below and save it in a file named <b>${esc(filename)}</b>.`}</p>
    <textarea class="in mono" id="expText" rows="10" readonly>${esc(text)}</textarea>`, `<button class="btn" data-close>Close</button><button class="btn primary" id="copyBtn">Copy to clipboard</button>`, () => {
      $('#copyBtn').addEventListener('click', () => {
        const ta = $('#expText');
        const fallback = () => { ta.focus(); ta.select(); toast('Text selected. Press Ctrl+C to copy.'); };
        try { navigator.clipboard.writeText(text).then(() => toast('Copied'), fallback); } catch (e) { fallback(); }
      });
    });
}
function exportJSON(){ offerFile('aliran-backup-' + todayISO() + '.json', JSON.stringify(Object.assign({exportedAt:new Date().toISOString(), app:'Aliran Cashflow'}, S), null, 2), 'application/json'); }
function exportCSV(){
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ['date','type','category','merchant_or_source','reference','amount','bill','goal','notes','source_file'];
  const rows = S.transactions.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(t => [t.date, t.type, t.category, t.merchant, t.reference, (+t.amount).toFixed(2), (S.bills.find(b => b.id === t.billId) || {}).name, (S.goals.find(g => g.id === t.goalId) || {}).name, t.notes, t.sourceFile].map(q).join(','));
  offerFile('aliran-transactions-' + todayISO() + '.csv', [head.join(','), ...rows].join('\n'), 'text/csv');
}
function importJSON(file){
  const rd = new FileReader();
  rd.onload = () => {
    let o;
    try { o = JSON.parse(rd.result); } catch (e) { toast('That file isn’t valid JSON.'); return; }
    if (!o || !Array.isArray(o.transactions) || !Array.isArray(o.bills)) { toast('That file doesn’t look like an Aliran backup.'); return; }
    confirmModal('Replace your data with this backup?', `The backup has ${o.transactions.length} transactions, ${o.bills.length} bills and ${(o.goals || []).length} goals${o.exportedAt ? ', exported ' + fmtDate(String(o.exportedAt).slice(0, 10)) : ''}. Everything currently in this browser is replaced.`, 'Replace data', () => {
      delete o.exportedAt; delete o.app;
      S = migrate(o); save(); applyTheme(); render(); toast('Backup imported');
    }, true);
  };
  rd.onerror = () => toast('Couldn’t read that file.');
  rd.readAsText(file);
}

/* ============ theme ============ */
function applyTheme(){
  const t = S.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
function isDark(){ const t = document.documentElement.getAttribute('data-theme'); if (t) return t === 'dark'; return window.matchMedia('(prefers-color-scheme: dark)').matches; }

/* ============ events ============ */
document.addEventListener('click', e => {
  const nb = e.target.closest('#nav button');
  if (nb) { ui.tab = nb.dataset.tab; try { history.replaceState(null, '', '#' + ui.tab); } catch (er) {} render(); window.scrollTo(0, 0); return; }
  const el = e.target.closest('[data-act]'); if (!el) { if (e.target.closest('#drop')) $('#fileInput').click(); return; }
  const a = el.dataset.act, id = el.dataset.id;
  switch (a){
    case 'pay': openPay(id, el.dataset.m); break;
    case 'unpay': unpay(id, el.dataset.m); break;
    case 'add-bill': openBillForm(); break;
    case 'edit-bill': openBillForm(S.bills.find(b => b.id === id)); break;
    case 'manual': openTxForm(null, {}); break;
    case 'upkind': ui.upKind = el.dataset.k; uiSave(); $$('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === ui.upKind)); break;
    case 'edit-tx': { const t = S.transactions.find(x => x.id === id); if (t) openTxForm(t, {}); break; }
    case 'del-tx': deleteTx(id); break;
    case 'add-goal': openGoalForm(); break;
    case 'edit-goal': openGoalForm(S.goals.find(g => g.id === id)); break;
    case 'contrib': openContrib(id); break;
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
    case 'import-json': $('#importInput').click(); break;
    case 'clear-sample': confirmModal('Clear sample data?', 'All example bills, transactions and goals are removed. Anything you added yourself stays, and your budget limits are kept so you can adjust them.', 'Clear sample data', clearSample, true); break;
    case 'load-sample': addSample(S); save(); render(); toast('Sample data loaded'); break;
    case 'sign-out': signOut(); break;
    case 'change-pw': {
      const cur = $('#pwCur').value, nw = $('#pwNew').value;
      if (!cur || !nw) { toast('Enter your current and new password.'); return; }
      api('POST', '/api/auth/password', {currentPassword:cur, newPassword:nw}).then(r => {
        if (r.ok) { $('#pwCur').value = ''; $('#pwNew').value = ''; toast('Password changed. Other devices were signed out.'); }
        else if (r.status === 401) showAuth('Your session ended. Sign in again.');
        else toast(r.data.message || r.data.error || 'Couldn’t change the password.');
      }, () => toast('Couldn’t reach the server.'));
      break;
    }
    case 'delete-account': openModal('Delete your account?', `<p style="margin:0">This permanently deletes your account and all its data from the server. Export a backup first if you might need it.</p>
        <label class="f">Your password<input class="in" type="password" id="daPass" autocomplete="current-password"></label>
        <label class="f">Type DELETE to confirm<input class="in" id="daConf" autocomplete="off"></label>`,
      `<button class="btn" data-close>Cancel</button><button class="btn danger solid" id="daOk" disabled>Delete account</button>`, () => {
        $('#daConf').addEventListener('input', () => $('#daOk').disabled = $('#daConf').value.trim() !== 'DELETE');
        $('#daOk').addEventListener('click', async () => {
          const r = await api('DELETE', '/api/account', {password:$('#daPass').value, confirm:'DELETE'}).catch(() => null);
          if (!r) { toast('Couldn’t reach the server.'); return; }
          if (!r.ok) { toast(r.data.error || 'Couldn’t delete the account.'); return; }
          clearTimeout(API.timer); API.dirty = false; API.csrf = null; API.email = null; S = null;
          await refreshRegistration();
          showAuth('Your account and its data were deleted.', API.registrationOpen ? 'register' : 'login');
        });
      }); break;
    case 'clear-all': openModal('Clear all data?', `<p style="margin:0">This permanently removes every transaction, bill, goal, budget and setting ${API.mode === 'server' ? 'saved in your account' : 'stored in this browser'}. Export a backup first if you might need it.</p><label class="f">Type DELETE to confirm<input class="in" id="delConf" autocomplete="off"></label>`, `<button class="btn" data-close>Cancel</button><button class="btn danger solid" id="delOk" disabled>Delete everything</button>`, () => {
        $('#delConf').addEventListener('input', () => $('#delOk').disabled = $('#delConf').value.trim().toUpperCase() !== 'DELETE');
        $('#delOk').addEventListener('click', () => { S = defaultState(); save(); closeModal(); applyTheme(); render(); toast('All data cleared'); });
      }); break;
    case 'add-cat': { const v = $('#newCat').value.trim(); if (!v) return; if ([...S.categories, ...INCOME_CATS, 'Savings'].some(c => c.toLowerCase() === v.toLowerCase())) { toast('That category already exists.'); return; } S.categories.splice(S.categories.length - 1, 0, v); S.settings.keywords[v] = S.settings.keywords[v] || []; save(); render(); toast('Added ' + v); break; }
    case 'del-cat': { const c = el.dataset.c; confirmModal('Remove ' + c + '?', `Transactions, bills and remembered payees in <b>${esc(c)}</b> move to Other, and its budget limit is removed.`, 'Remove', () => {
        S.categories = S.categories.filter(x => x !== c);
        S.transactions.forEach(t => { if (t.type === 'expense' && t.category === c) t.category = 'Other'; });
        S.bills.forEach(b => { if (b.category === c) b.category = 'Other'; });
        delete S.budgets[c]; delete S.settings.keywords[c];
        for (const k in S.settings.merchantCategoryMap) if (S.settings.merchantCategoryMap[k] === c) delete S.settings.merchantCategoryMap[k];
        save(); render(); }, true); break; }
    case 'reset-kw': S.settings.keywords = Object.assign(clone(KW_DEFAULT), Object.fromEntries(S.categories.filter(c => !KW_DEFAULT[c]).map(c => [c, S.settings.keywords[c] || []]))); save(); render(); toast('Keywords reset'); break;
    case 'forget': delete S.settings.merchantCategoryMap[el.dataset.k]; save(); render(); break;
  }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'drop') { e.preventDefault(); $('#fileInput').click(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'mSel') { ui.month = t.value; render(); }
  else if (t.id === 'fM') { ui.f.month = t.value; render(); }
  else if (t.id === 'fT') { ui.f.type = t.value; render(); }
  else if (t.id === 'fC') { ui.f.cat = t.value; render(); }
  else if (t.dataset.budget) { const v = round2(t.value); if (v > 0) S.budgets[t.dataset.budget] = v; else delete S.budgets[t.dataset.budget]; save(); render(); }
  else if (t.id === 'svMode') { S.settings.savingsMode = t.value; save(); render(); }
  else if (t.id === 'svVal') { const v = Math.max(0, +t.value || 0); if (S.settings.savingsMode === 'percent') S.settings.savingsPercent = Math.min(100, v); else S.settings.savingsFixed = round2(v); save(); render(); }
  else if (t.id === 'setTheme') { S.settings.theme = t.value; save(); applyTheme(); render(); }
  else if (t.id === 'setCur') { S.settings.currency = t.value; save(); render(); }
  else if (t.dataset.kw) { S.settings.keywords[t.dataset.kw] = t.value.split(',').map(s => s.trim()).filter(Boolean); save(); toast('Keywords saved'); }
  else if (t.id === 'fileInput') { const f = t.files[0]; t.value = ''; handleFile(f); }
  else if (t.id === 'importInput') { const f = t.files[0]; t.value = ''; if (f) importJSON(f); }
});
let qT;
document.addEventListener('input', e => {
  if (e.target.id === 'fQ') { clearTimeout(qT); const v = e.target.value; qT = setTimeout(() => { ui.f.q = v; render(); const i = $('#fQ'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 250); }
});
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } }));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); if (ev === 'drop' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); } }));
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { if (!(e.target.closest && e.target.closest('#drop'))) e.preventDefault(); });
$('#mPrev').addEventListener('click', () => { ui.month = addMonths(ui.month, -1); render(); });
$('#mNext').addEventListener('click', () => { ui.month = addMonths(ui.month, 1); render(); });
$('#themeBtn').addEventListener('click', () => { S.settings.theme = isDark() ? 'light' : 'dark'; save(); applyTheme(); render(); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener && window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (ui.tab === 'dashboard') render(); });
window.matchMedia('(max-width:880px)').addEventListener && window.matchMedia('(max-width:880px)').addEventListener('change', renderNav);
new MutationObserver(() => { if (S && ui.tab === 'dashboard' && !$('#scrim')) { destroyCharts(); const v = $('#view'); renderDashboard(v); } }).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

/* ============ boot ============ */
function startLocal(){
  API.mode = 'local';
  S = load();
  if (!S) { S = defaultState(); addSample(S); save(); }
  if (S.settings.theme === 'light' || S.settings.theme === 'dark') applyTheme();
  render();
}
async function startServer(info){
  API.mode = 'server'; API.registrationOpen = !!info.registrationOpen; storageOk = true;
  if (info.authenticated) { API.csrf = info.csrfToken; API.email = info.email; await afterSignIn(); }
  else showAuth();
}
(function boot(){
  uiLoad();
  ui.month = curYM();
  const h = (location.hash || '').slice(1);
  if (NAV.some(n => n.id === h)) ui.tab = h;
  // Opened as a file or inside a viewer: local-only mode. Served by the Aliran backend: sign in and sync.
  if (!canHaveServer()) { startLocal(); return; }
  $('#view').innerHTML = '<div class="empty">Loading…</div>';
  detectServer().then(info => info ? startServer(info) : startLocal());
})();
</script>
