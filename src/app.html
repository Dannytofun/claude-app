<title>Aliran Cashflow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left ledger-sidebar + scrolling work area; collapses to a top tab bar under 880px */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface-2:#edf2ef; --ink:#13201b; --ink-2:#45564f; --muted:#74857e;
  --line:#dbe3df; --accent:#0d6b57; --accent-ink:#ffffff; --accent-soft:#dcefe8;
  --side-bg:#0f2620; --side-ink:#cfe2da; --side-muted:#86a69a; --side-active:#1d3d34;
  --good:#127a3c; --good-soft:#dff2e6; --warn:#a86300; --warn-soft:#fbefd9; --bad:#c2362f; --bad-soft:#fbe3e1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --shadow:0 1px 2px rgba(16,38,32,.06),0 4px 16px rgba(16,38,32,.05);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1311; --surface:#131c19; --surface-2:#1a2521; --ink:#e4eee9; --ink-2:#a9bab3; --muted:#7a8c85;
  --line:#25322d; --accent:#4cc0a0; --accent-ink:#06231b; --accent-soft:#163a30;
  --side-bg:#08100d; --side-ink:#cfe2da; --side-muted:#6f8c81; --side-active:#16302a;
  --good:#46c477; --good-soft:#123321; --warn:#f0a531; --warn-soft:#382a10; --bad:#f06a61; --bad-soft:#3d1a18;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1311; --surface:#131c19; --surface-2:#1a2521; --ink:#e4eee9; --ink-2:#a9bab3; --muted:#7a8c85;
  --line:#25322d; --accent:#4cc0a0; --accent-ink:#06231b; --accent-soft:#163a30;
  --side-bg:#08100d; --side-ink:#cfe2da; --side-muted:#6f8c81; --side-active:#16302a;
  --good:#46c477; --good-soft:#123321; --warn:#f0a531; --warn-soft:#382a10; --bad:#f06a61; --bad-soft:#3d1a18;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;}
*{box-sizing:border-box}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:1.6rem}h2{font-size:1.12rem}h3{font-size:.98rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}.ink2{color:var(--ink-2)}
.pos{color:var(--good)}.neg{color:var(--bad)}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side-bg);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(160deg,#4cc0a0,#0d6b57);display:grid;place-items:center}
.brand b{font-family:var(--f-display);font-size:1.2rem;display:block;line-height:1.1}
.brand small{color:var(--side-muted);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-ink);font-weight:500}
.nav button:hover{background:var(--side-active)}
.nav button[aria-current="page"]{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 #4cc0a0}
.nav button:focus-visible{outline:2px solid #4cc0a0}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.nav .count{margin-left:auto;background:#c2362f;color:#fff;font-size:.72rem;border-radius:99px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;font-size:.76rem;color:var(--side-muted);padding:0 8px;line-height:1.45}
.main{min-width:0;padding-block:24px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.topbar h1{margin-right:auto}
.monthpick{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px}
.monthpick select{border:0;background:transparent;font-weight:600;padding:4px 6px;cursor:pointer}
.iconbtn{all:unset;cursor:pointer;width:30px;height:30px;border-radius:99px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:focus-visible{outline:2px solid var(--accent)}
.iconbtn svg{width:16px;height:16px}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.panel-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.panel-h h2{margin-right:auto}
.stack{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid-wide{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 13px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--ink-2);min-width:0}
input.in,select.in,textarea.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:.92rem;font-weight:400;color:var(--ink);width:100%;min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.in.missing{border-color:var(--warn);background:var(--warn-soft)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form-grid .full{grid-column:1/-1}
.hint{font-size:.78rem;color:var(--muted);font-weight:400}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-paid{background:var(--good-soft);color:var(--good)}
.b-due3{background:var(--bad-soft);color:var(--bad)}
.b-due7{background:var(--warn-soft);color:var(--warn)}
.b-overdue{background:var(--bad);color:#fff}
.b-overdue::before{background:#fff}
.b-upcoming{background:var(--surface-2);color:var(--ink-2)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.tablewrap{overflow-x:auto;margin:0 -4px}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right}
table.t td.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.cell-title{font-weight:600}
.cell-sub{font-size:.8rem;color:var(--muted)}

/* due strip */
.due{display:flex;gap:10px;align-items:stretch;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.due-lead{flex:none;display:flex;flex-direction:column;justify-content:center;padding:10px 14px 10px 0;min-width:120px}
.due-lead b{font-family:var(--f-display);font-size:1.05rem}
.due-item{flex:none;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:190px}
.due-item.overdue{border-color:var(--bad);background:var(--bad-soft)}
.due-item.due3{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.due-item.due7{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.due-item .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.due-item .nm{font-weight:600}
.due-ok{display:flex;align-items:center;gap:10px;background:var(--good-soft);color:var(--good);border-radius:var(--r);padding:10px 14px;font-weight:600}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:.78rem;color:var(--muted)}
.kpi.net{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.net .eyebrow,.kpi.net .d{color:inherit;opacity:.8}
.kpi.net.negative{background:var(--bad);border-color:var(--bad);color:#fff}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.alert{display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:8px;font-size:.9rem;background:var(--warn-soft);color:var(--ink)}
.alert.bad{background:var(--bad-soft)}
.alert svg{width:16px;height:16px;flex:none;color:var(--warn)}
.alert.bad svg{color:var(--bad)}

/* statement */
.stmt{width:100%;border-collapse:collapse;font-size:.9rem}
.stmt td{padding:5px 0}
.stmt td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.stmt .sec td{text-align:left!important;padding-top:14px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stmt .grp td{font-weight:600}
.stmt .sub td:first-child{padding-left:16px;color:var(--ink-2)}
.stmt .sub td:last-child{color:var(--ink-2)}
.stmt .tot td{border-top:1px solid var(--line);font-weight:700;padding-top:8px}
.stmt .net td{border-top:2px solid var(--ink);font-family:var(--f-display);font-size:1.05rem;font-weight:700;padding-top:10px}

/* bars */
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.88rem}
.bar-row .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:99px;background:var(--accent)}
.fill.warn{background:var(--warn)}.fill.over{background:var(--bad)}.fill.good{background:var(--good)}
.bar-row .val{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}

/* budgets */
.budget{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:6px 16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.budget:last-child{border-bottom:0}
.budget .bt{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.budget .bt b{font-weight:600}
.budget .track{grid-column:1}
.budget .lim{grid-row:1/span 2;grid-column:2}
.state{font-size:.75rem;font-weight:700}
.state.warn{color:var(--warn)}.state.over{color:var(--bad)}

/* goals */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.goal{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.goal .big{font-family:var(--f-display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.goal .track{height:12px}

/* compare */
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.cmp > div{background:var(--surface-2);border-radius:8px;padding:10px 12px;min-width:0}
.cmp .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.02rem}
.cmp .dl{font-size:.78rem;font-weight:600}
.insights{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.insights li{display:flex;gap:10px;align-items:flex-start}
.insights li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}

/* upload */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;transition:border-color .15s,background .15s;cursor:pointer;background:var(--surface)}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:34px;height:34px;color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:6px;font-size:.84rem;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.progress{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:8px;background:var(--surface-2);margin-top:12px}
.progress .track{height:8px}
.progress .fill{transition:width .2s}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.amt-in{color:var(--good)}.amt-out{color:var(--ink)}.amt-sav{color:var(--accent)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(6,16,13,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:min(620px,100%);max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 22px 6px}
.modal-h h2{margin-right:auto}
.modal-b{padding:10px 22px 4px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px 20px;flex-wrap:wrap}
.note{font-size:.84rem;padding:9px 12px;border-radius:8px;background:var(--surface-2);color:var(--ink-2)}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.note.bad{background:var(--bad-soft);color:var(--ink)}
details.raw summary{cursor:pointer;font-size:.82rem;color:var(--muted);font-weight:600}
details.raw pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:.76rem;background:var(--surface-2);padding:10px;border-radius:8px;max-height:200px;overflow:auto;margin:8px 0 0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:.9rem;z-index:60;box-shadow:var(--shadow)}
.chart-box{position:relative;height:260px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.catlist{display:flex;flex-wrap:wrap;gap:8px}
.catlist .chip button{all:unset;cursor:pointer;color:var(--muted);font-weight:700;padding:0 2px}
.catlist .chip button:hover{color:var(--bad)}
.kw-grid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 12px;align-items:center;font-size:.86rem}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
#authRoot{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.auth-card .brand{padding:0}
.auth-card .brand small{color:var(--muted)}
#syncStatus{display:inline-block;margin-top:4px}
#syncStatus[data-state="offline"],#syncStatus[data-state="error"]{color:#f0a531}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi.net{grid-column:span 1}}
@media (max-width:1020px){.grid2,.grid-wide,.set-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:12px;z-index:20;overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side-bg)}
  .brand small,.side-foot{display:none}
  .nav{flex-direction:row}
  .nav button{padding:7px 10px;white-space:nowrap}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 #4cc0a0}
  .nav .lbl-long{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width:620px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:12px}
  .kpi .v{font-size:1.08rem}
  .kpi.net{grid-column:1/-1}
  .kpi.net .v{font-size:1.4rem}
  .form-grid,.filters,.cmp{grid-template-columns:minmax(0,1fr)}
  .budget{grid-template-columns:minmax(0,1fr) 100px}
  .kw-grid{grid-template-columns:minmax(0,1fr)}
  .nav svg{display:none}
  .bar-row{grid-template-columns:minmax(0,96px) minmax(0,1fr) auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M3 15c3-5 6 3 9-2s6-6 9-3"/><path d="M3 20h18"/></svg></div>
      <div><b>Aliran</b><small>Personal cashflow</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot" id="sideFoot">Your data stays in this browser only. Back it up from <i>Settings &amp; Backup</i> regularly.</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h1 id="pageTitle">Dashboard</h1>

const API = {mode:'local', csrf:null, email:null, version:0, registrationOpen:false, timer:null, inflight:false, dirty:false, sync:'saved', syncMsg:'', resume:null};
async function api(method, url, body){
  const opts = {method, credentials:'same-origin', headers:{'Accept':'application/json'}};
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  if (method !== 'GET' && API.csrf) opts.headers['X-CSRF-Token'] = API.csrf;
  const r = await fetch(url, opts);
  let data = null; try { data = await r.json(); } catch (e) {}
  return {status:r.status, ok:r.ok, data:data || {}};
}
const canHaveServer = () => /^https?:$/.test(location.protocol) && typeof fetch === 'function';
async function detectServer(){
  try {

    const t = setTimeout(() => ctl && ctl.abort(), 4000);
    const r = await fetch('/api/session', {credentials:'same-origin', headers:{Accept:'application/json'}, signal:ctl ? ctl.signal : undefined});
    clearTimeout(t);
    if (!r.ok) return null;
    const d = await r.json();
    return d && d.app === 'aliran' ? d : null;
  } catch (e) { return null; }
}
function setSync(state, msg){

  const txt = {saved:'Saved to your account', saving:'Saving…', offline:'Not saved yet. Retrying when the server is reachable.', error:msg || 'The server refused this change.'}[state];

function queueSync(){ API.dirty = true; setSync('saving'); clearTimeout(API.timer); API.timer = setTimeout(syncNow, 600); }
async function syncNow(){
  if (API.mode !== 'server' || !API.csrf) return;
  if (API.inflight) { clearTimeout(API.timer); API.timer = setTimeout(syncNow, 300); return; }
  if (!API.dirty) return;
  API.inflight = true; API.dirty = false;
  try {
    const r = await api('PUT', '/api/state', {version:API.version, data:S});
    if (r.ok) { API.version = r.data.version; if (!API.dirty) setSync('saved'); }

      applyTheme(); closeModal(); render(); setSync('saved');

    }
    else if (r.status === 401) { API.resume = {email:API.email, version:API.version}; API.dirty = true; showAuth('Your session ended. Sign in again to save your latest changes.'); }

}
async function afterSignIn(){
  const r = await api('GET', '/api/state');
  if (!r.ok) { showAuth(r.status === 401 ? '' : 'Couldn’t load your data. Try again.'); return; }
  const resume = API.resume; API.resume = null;
  if (resume && resume.email === API.email && r.data.version === resume.version && S) {
    API.version = r.data.version; API.dirty = true;          // nothing changed elsewhere: keep unsaved edits
  } else if (r.data.data) {
    S = migrate(r.data.data); API.version = r.data.version; API.dirty = false;
  } else {
    API.version = 0;
    const local = load(); // data kept in this browser while the server was unreachable
    if (local && local.transactions.some(t => !t.sample)) { S = local; setTimeout(() => toast('Copied the data saved in this browser into your account.'), 50); }

    const isCur = m === cur, dim = daysInMonth(m), maxDay = isCur ? td : dim;
    // payslip
    const gross = i < 3 ? 6800 : 7150, epf = Math.round(gross * 0.11), socso = 29.75, eis = 11.9, pcb = i < 3 ? 386.5 : 418.2;
    const net = round2(gross - epf - socso - eis - pcb);
    const payDay = Math.min(25, maxDay);
    const pd = m + '-' + pad(payDay);
    tx({type:'income', amount:net, date:pd, category:'Salary', merchant:'Rimba Analytics Sdn Bhd', reference:'PAY' + m.replace('-', ''), sourceFile:'payslip-' + m + '.pdf', payslip:{gross, epf, socso, eis, pcb, period:m}});
    tx({type:'savings', amount:round2(net * 0.10), date:pd, category:'Savings', merchant:'Pay yourself first', goalId:gE.id, notes:'10% of net pay'});
    if (i >= 1) tx({type:'savings', amount:200, date:pd, category:'Savings', merchant:'Japan trip top-up', goalId:gJ.id});
    if (i === 2) tx({type:'income', amount:650, date:m + '-12', category:'Freelance', merchant:'Logo design – Kedai Kopi Hang', reference:'INV-0412'});
    // bills
    bills.forEach(b => {
      const d = Math.min(b.dueDay, dim);
      const paid = !isCur || (d < td && !b._d.late);
      if (!paid) return;
      const amt = b.isVariable ? r(b._d.range[0], b._d.range[1]) : b.amount;
      const day = Math.max(1, d - (i % 2));
      const t = tx({type:'expense', amount:amt, date:m + '-' + pad(day), category:b.category, merchant:b._d.payee, reference:'FPX' + String(Math.floor(rnd() * 1e9)).padStart(9, '0'), billId:b.id, notes:'Bill payment', sourceFile:b.isVariable ? 'receipt-' + b._d.payee.toLowerCase().replace(/\s+/g, '-') + '.png' : ''});
      st.billPayments.push({billId:b.id, month:m, paidDate:t.date, actualAmount:amt, transactionId:t.id, createdTx:true, sample:true});
    });
    // spending
    spend.forEach(([name, cat, lo, hi, n]) => {
      let count = n, hiX = hi;
      if (isCur && cat === 'Food & Dining') count = n + 2;
      if (isCur && cat === 'Shopping') { count = 3; hiX = 190; }
      if (i === 3 && cat === 'Groceries') count = n + 1;
      for (let k = 0; k < count; k++){
        const frac = (k + 0.5) / count;
        if (isCur && Math.ceil(frac * dim) > td) continue;
        const day = Math.max(1, Math.min(maxDay, Math.round(frac * dim + (rnd() - .5) * 3)));
        tx({type:'expense', amount:r(lo, hiX), date:m + '-' + pad(day), category:cat, merchant:name, reference:rnd() < .5 ? 'DN' + Math.floor(rnd() * 1e8) : ''});
      }
    });
  });
  bills.forEach(b => { delete b._d; st.bills.push(b); });
  Object.assign(st.budgets, {'Food & Dining':520, 'Groceries':520, 'Transport':420, 'Shopping':260, 'Entertainment':120, 'Health':150, 'Subscriptions':90});
  st.hasSample = true;
}

/* ============ derived data ============ */
const txMonth = t => (t.date || '').slice(0, 7);
function monthTx(m){ return S.transactions.filter(t => txMonth(t) === m); }
function monthTotals(m){
  const txs = monthTx(m);
  const inc = txs.filter(t => t.type === 'income'), exp = txs.filter(t => t.type === 'expense'), sav = txs.filter(t => t.type === 'savings');
  const bills = exp.filter(t => t.billId), other = exp.filter(t => !t.billId);
  const group = (arr, key) => { const o = {}; arr.forEach(t => { const k = key(t) || 'Other'; o[k] = round2((o[k] || 0) + t.amount); }); return o; };
  const income = sum(inc.map(t => t.amount)), billsT = sum(bills.map(t => t.amount)), otherT = sum(other.map(t => t.amount)), saved = sum(sav.map(t => t.amount));
  return {
    income, bills:billsT, other:otherT, saved, spending:round2(billsT + otherT),
    net:round2(income - billsT - otherT - saved),
    incomeBySource:group(inc, t => t.category + (t.merchant ? ' · ' + t.merchant : '')),
    billsByCat:group(bills, t => t.category), otherByCat:group(other, t => t.category),
    byCat:group(exp, t => t.category),
    savByGoal:group(sav, t => (S.goals.find(g => g.id === t.goalId) || {}).name || 'General savings')
  };
}
function billDueIn(b, m){
  if (b.startMonth && monthDiff(b.startMonth, m) < 0) return false;
  const diff = b.startMonth ? monthDiff(b.startMonth, m) : 0;
  if (b.frequency === 'quarterly') return diff % 3 === 0;
  if (b.frequency === 'yearly') return diff % 12 === 0;
  return true;
}
function billDueDate(b, m){ return parseISO(m + '-' + pad(Math.min(b.dueDay, daysInMonth(m)))); }
function billPayment(b, m){ return S.billPayments.find(p => p.billId === b.id && p.month === m); }
function billStatus(b, m){
  const pay = billPayment(b, m);
  const due = billDueDate(b, m);
  if (pay) return {key:'paid', label:'Paid', pay, due};
  const diff = daysBetween(todayDate(), due);
  if (diff < 0) return {key:'overdue', label:'Overdue ' + (-diff) + (-diff === 1 ? ' day' : ' days'), diff, due};
  if (diff === 0) return {key:'due3', label:'Due today', diff, due};
  if (diff <= 3) return {key:'due3', label:'Due in ' + diff + (diff === 1 ? ' day' : ' days'), diff, due};
  if (diff <= 7) return {key:'due7', label:'Due in ' + diff + ' days', diff, due};
  return {key:'upcoming', label:'Due ' + fmtShort(toISO(due)), diff, due};
}
// Every unpaid month since the bill started (up to 2 years back; 3 months if the start is unknown),
// plus anything due within 7 days, including early next month.
const DUE_LOOKBACK_MAX = 24;
function dueSoon(){
  const cur = curYM(), end = addMonths(cur, 1), out = [];
  S.bills.forEach(b => {
    let m = !b.startMonth ? addMonths(cur, -3) : monthDiff(b.startMonth, cur) > DUE_LOOKBACK_MAX ? addMonths(cur, -DUE_LOOKBACK_MAX) : b.startMonth;
    for (; monthDiff(m, end) >= 0; m = addMonths(m, 1)){
      if (!billDueIn(b, m)) continue;
      const st = billStatus(b, m);
      if (st.key === 'overdue' || st.key === 'due3' || st.key === 'due7') out.push({b, m, st});
    }
  });
  return out.sort((a, b) => a.st.due - b.st.due);
}
function catSpend(m, cat){ return sum(monthTx(m).filter(t => t.type === 'expense' && t.category === cat).map(t => t.amount)); }
function budgetRows(m){
  return S.categories.filter(c => +S.budgets[c] > 0).map(c => {
    const spent = catSpend(m, c), lim = +S.budgets[c], pct = lim ? spent / lim * 100 : 0;
    return {c, spent, lim, pct, state: pct >= 100 ? 'over' : pct >= 80 ? 'warn' : 'ok'};
  });
}
function goalSaved(g){ return round2((+g.savedAmount || 0) + sum(S.transactions.filter(t => t.type === 'savings' && t.goalId === g.id).map(t => t.amount))); }
function goalRate(g){
  const cur = curYM(); const ms = [addMonths(cur, -2), addMonths(cur, -1), cur];
  return round2(sum(S.transactions.filter(t => t.type === 'savings' && t.goalId === g.id && ms.includes(txMonth(t))).map(t => t.amount)) / 3);
}
function suggestedSavings(net){ return S.settings.savingsMode === 'fixed' ? round2(+S.settings.savingsFixed || 0) : round2(net * (+S.settings.savingsPercent || 0) / 100); }

/* ============ categorisation ============ */
function kwMatch(text, kw){
  const k = kw.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp('(^|[^A-Z0-9])' + k + '([^A-Z0-9]|$)').test(text);
}
function suggestCategory(merchant, fullText){
  const nm = normMerchant(merchant);
  if (nm && S.settings.merchantCategoryMap[nm] && S.categories.includes(S.settings.merchantCategoryMap[nm])) return {cat:S.settings.merchantCategoryMap[nm], why:'remembered'};
  const pairs = [];
  for (const [cat, kws] of Object.entries(S.settings.keywords)) if (S.categories.includes(cat)) (kws || []).forEach(k => k && pairs.push([cat, k]));
  pairs.sort((a, b) => b[1].length - a[1].length);
  const M = String(merchant || '').toUpperCase();
  for (const [cat, k] of pairs) if (M && kwMatch(M, k)) return {cat, why:'keyword “' + k + '”'};
  const F = String(fullText || '').toUpperCase();
  for (const [cat, k] of pairs) if (F && k.length >= 4 && kwMatch(F, k)) return {cat, why:'keyword “' + k + '” in receipt'};
  return {cat:'', why:''};
}

/* ============ parsing ============ */
const MONTH_WORDS = {jan:1,january:1,januari:1,feb:2,february:2,februari:2,mar:3,march:3,mac:3,apr:4,april:4,may:5,mei:5,jun:6,june:6,jul:7,july:7,julai:7,aug:8,august:8,ogos:8,sep:9,sept:9,september:9,oct:10,october:10,okt:10,oktober:10,nov:11,november:11,dec:12,december:12,dis:12,disember:12};
function mkDate(y, m, d){
  y = +y; if (y < 100) y += 2000; m = +m; d = +d;
  if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31 && y >= 2000 && y <= 2100)) return '';
  if (d > new Date(y, m, 0).getDate()) return '';
  return y + '-' + pad(m) + '-' + pad(d);
}
function datesIn(s){
  const out = []; let r;
  const re1 = /\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/g;
  while ((r = re1.exec(s))) { const v = mkDate(r[1], r[2], r[3]); if (v) out.push([r.index, v]); }
  const re2 = /\b(\d{1,2})[-\/.](\d{1,2})[-\/.](20\d{2}|\d{2})\b/g;
  while ((r = re2.exec(s))) { const v = mkDate(r[3], r[2], r[1]); if (v) out.push([r.index, v]); }
  const re3 = /\b(\d{1,2})(?:st|nd|rd|th)?[\s\-]+([A-Za-z]{3,9})\.?[\s\-,]+(20\d{2})\b/g;
  while ((r = re3.exec(s))) { const mo = MONTH_WORDS[r[2].toLowerCase()]; if (mo) { const v = mkDate(r[3], mo, r[1]); if (v) out.push([r.index, v]); } }
  const re4 = /\b([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(20\d{2})\b/g;
  while ((r = re4.exec(s))) { const mo = MONTH_WORDS[r[1].toLowerCase()]; if (mo) { const v = mkDate(r[3], mo, r[2]); if (v) out.push([r.index, v]); } }
  return out.sort((a, b) => a[0] - b[0]).map(x => x[1]);
}
function parseDate(lines){
  for (const l of lines) if (/(date|tarikh|time|masa|paid on|on\b)/i.test(l)) { const d = datesIn(l); if (d.length) return d[0]; }
  for (const l of lines) { const d = datesIn(l); if (d.length) return d[0]; }
  return '';
}
const toNum = s => +String(s).replace(/[,\s]/g, '');
// allowZero: a labelled "0.00" (e.g. PCB 0.00) is a real value, not a missing one
function rmAmounts(s, allowZero){
  const out = []; let r; const re = /(?:RM|MYR)\s*:?\s*(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)/gi;
  while ((r = re.exec(s))) { const n = toNum(r[1]); if (n > 0 || (allowZero && n === 0)) out.push(n); }
  return out;
}
function decAmounts(s, allowZero){
  const out = []; let r; const re = /(?:^|[^\d.])(\d{1,3}(?:,\d{3})+\.\d{2}|\d+\.\d{2})(?![\d%])/g;
  while ((r = re.exec(s))) { const n = toNum(r[1]); if (n > 0 || (allowZero && n === 0)) out.push(n); }
  return out;
}
function amountAfter(lines, re, opts = {}){
  const amts = s => { const a = rmAmounts(s, true); return a.length ? a : decAmounts(s, true); };
  for (let i = 0; i < lines.length; i++){
    const l = lines[i]; const mm = l.match(re);
    if (!mm) continue;
    if (opts.skip && opts.skip.test(l)) continue;
    const a = amts(l.slice(mm.index + mm[0].length));
    if (a.length) return a[0];
    // value on the next line only if that line is just a number, not another labelled row
    const nx = lines[i + 1];
    if (nx && !/[A-Za-z]/.test(nx.replace(/\b(RM|MYR)\b/gi, ''))) { const b = amts(nx); if (b.length) return b[0]; }
  }
  return null;
}
function valueAfter(lines, re){
  for (let i = 0; i < lines.length; i++){
    const mm = lines[i].match(re);
    if (!mm) continue;
    let v = lines[i].slice(mm.index + mm[0].length).replace(/^[\s:：\-–|]+/, '').trim();
    if (!v && lines[i + 1]) v = lines[i + 1].trim();
    if (v) return v;
  }
  return '';
}
function isPayslip(text){
  return /(pay\s*slip|payslip|slip\s*gaji|penyata\s*gaji|net\s*pay|gaji\s*bersih|nett\s*pay)/i.test(text) || (/\b(epf|kwsp)\b/i.test(text) && /\b(socso|perkeso)\b/i.test(text));
}
function parseReceipt(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let amount = amountAfter(lines, /(total\s*amount|amount\s*paid|payment\s*amount|transfer\s*amount|transaction\s*amount|grand\s*total|jumlah\s*(?:bayaran|pindahan)?|amaun|total|amount|paid)/i, {skip:/(balance|baki|fee|caj|charge|available)/i});
  if (amount == null) { const all = rmAmounts(text); if (all.length) amount = all[0]; }
  const date = parseDate(lines);
  let merchant = valueAfter(lines, /\b(recipient(?:'s)?\s*name|beneficiary(?:\s*name)?|payee(?:\s*name)?|paid\s*to|pay\s*to|transfer(?:red)?\s*to|merchant(?:\s*name)?|biller(?:\s*name)?|nama\s*penerima|penerima|bill(?:er)?\s*name|recipient|to\s*account(?:\s*name)?)\b\s*[:：\-]?/i);
  if (!merchant) {
    const i = lines.findIndex(l => /^(to|kepada|pay\s*to|paid\s*to)\s*[:：]?/i.test(l));
    if (i >= 0) { merchant = lines[i].replace(/^(to|kepada|pay\s*to|paid\s*to)\s*[:：]?\s*/i, ''); if (!merchant && lines[i + 1]) merchant = lines[i + 1]; }
  }
  merchant = merchant.replace(/\s{2,}.*/, '').replace(/[|]/g, '').slice(0, 60).trim();
  let refRaw = valueAfter(lines, /\b(duitnow\s*ref(?:erence)?(?:\s*(?:no|id))?|reference\s*(?:no|number|id)\.?|ref(?:erence)?\.?\s*(?:no|id)\.?|transaction\s*(?:id|no|ref(?:erence)?)\.?|txn\s*(?:id|no)\.?|no\.?\s*rujukan|rujukan|invoice\s*(?:no|number)|receipt\s*(?:no|number)|reference)\b\s*[:：#\-]?/i);
  const refTok = (refRaw.match(/[A-Z0-9][A-Z0-9\-\/]{3,}/i) || [''])[0];
  const reference = /\d/.test(refTok) ? refTok : '';

}
function parsePayslip(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const er = /(employer|majikan|company\s*contribution)/i;
  const gross = amountAfter(lines, /(gross\s*(?:pay|salary|earnings|wages|income)?|total\s*earnings|jumlah\s*pendapatan|gaji\s*kasar|total\s*gross)/i);
  const net = amountAfter(lines, /(net\s*(?:pay|salary|wages|amount|income)|nett\s*(?:pay|salary)|gaji\s*bersih|take[\s-]*home(?:\s*pay)?|jumlah\s*bersih|amount\s*payable)/i);
  const epf = amountAfter(lines, /\b(epf|kwsp)\b/i, {skip:er});
  const socso = amountAfter(lines, /\b(socso|perkeso|sosco)\b/i, {skip:er});
  const eis = amountAfter(lines, /\b(eis|sip)\b/i, {skip:er});
  const pcb = amountAfter(lines, /\b(pcb|mtd|income\s*tax|cukai\s*pendapatan)\b/i, {skip:er});
  let period = '';
  const pv = valueAfter(lines, /\b(pay\s*period|pay\s*month|salary\s*month|period|bulan|month)\b\s*[:：\-]?/i);
  const findPeriod = s => {
    let r = s.match(/([A-Za-z]{3,9})\.?\s*[-\/ ,]?\s*(20\d{2})/);
    if (r && MONTH_WORDS[r[1].toLowerCase()]) return r[2] + '-' + pad(MONTH_WORDS[r[1].toLowerCase()]);
    r = s.match(/\b(\d{1,2})[\/\-](20\d{2})\b/); if (r && +r[1] >= 1 && +r[1] <= 12) return r[2] + '-' + pad(r[1]);
    const d = datesIn(s); if (d.length) return d[d.length - 1].slice(0, 7);
    return '';
  };
  if (pv) period = findPeriod(pv);
  if (!period) for (const l of lines) { const r = l.match(/\b([A-Za-z]{3,9})\.?\s+(20\d{2})\b/); if (r && MONTH_WORDS[r[1].toLowerCase()]) { period = r[2] + '-' + pad(MONTH_WORDS[r[1].toLowerCase()]); break; } }
  let employer = valueAfter(lines, /\b(company(?:\s*name)?|employer(?:\s*name)?|majikan|syarikat)\b\s*[:：\-]/i);
  if (!employer) employer = (lines.find(l => /(sdn\.?\s*bhd|berhad|\bbhd\b|plc|enterprise)/i.test(l)) || '');
  employer = employer.slice(0, 60).trim();
  const date = parseDate(lines.filter(l => !/(join|birth|lahir|mula)/i.test(l)));
  return {kind:'payslip', type:'income', amount:net, date, merchant:employer, reference:'', category:'Salary', payslip:{gross, epf, socso, eis, pcb, period}};
}

/* ============ file reading / OCR ============ */
const scriptCache = {};
function loadScript(src){
  if (!scriptCache[src]) scriptCache[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.async = true;
    if (SRI[src]) { s.integrity = SRI[src]; s.crossOrigin = 'anonymous'; }
    s.onload = res; s.onerror = () => { delete scriptCache[src]; rej(new Error('Could not load ' + src.split('/').slice(-1)[0])); };
    document.head.appendChild(s);
  });
  return scriptCache[src];
}
function withStall(run, ms){
  return new Promise((res, rej) => {
    let t; const kick = () => { clearTimeout(t); t = setTimeout(() => rej(new Error('Text recognition stopped responding')), ms); };
    kick();
    Promise.resolve().then(() => run(kick)).then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });
  });
}
async function ocrImage(src, onProg, label){
  await loadScript(CDN.tess);
  if (!window.Tesseract) throw new Error('OCR library unavailable');
  return withStall(async kick => {
    const r = await Tesseract.recognize(src, 'eng', {
      logger: m => { kick(); if (m && m.status) onProg((label || '') + m.status.replace(/^./, c => c.toUpperCase()), m.progress || 0); },
      errorHandler: () => {}
    });
    return (r && r.data && r.data.text) || '';
  }, 45000);
}
async function readFileText(file, onProg){
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  const isImg = /^image\/(png|jpe?g)$/.test(file.type) || /\.(png|jpe?g)$/i.test(file.name);
  if (!isPdf && !isImg) throw new Error('Unsupported file type. Use PNG, JPG or PDF.');
  if (isImg) { onProg('Starting text recognition…', 0); return {text:await ocrImage(file, onProg), method:'OCR'}; }
  onProg('Opening PDF…', 0.05);
  await loadScript(CDN.pdf);
  const lib = window.pdfjsLib; if (!lib) throw new Error('PDF reader unavailable');
  lib.GlobalWorkerOptions.workerSrc = CDN.pdfWorker;
  const pdf = await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const n = Math.min(pdf.numPages, 4); const out = [];
  for (let p = 1; p <= n; p++){
    onProg('Reading page ' + p + ' of ' + n + '…', p / (n + 1));
    const page = await pdf.getPage(p); const tc = await page.getTextContent();
    const rows = new Map();
    tc.items.forEach(it => { if (!it.str || !it.str.trim()) return; const y = Math.round(it.transform[5] / 4); if (!rows.has(y)) rows.set(y, []); rows.get(y).push({x:it.transform[4], s:it.str}); });
    [...rows.keys()].sort((a, b) => b - a).forEach(y => out.push(rows.get(y).sort((a, b) => a.x - b.x).map(o => o.s).join('  ').replace(/\s{3,}/g, '  ')));
  }
  const text = out.join('\n');
  if (text.replace(/\s/g, '').length >= 30) return {text, method:'PDF text'};
  // scanned PDF -> render and OCR
  let all = '';
  for (let p = 1; p <= Math.min(pdf.numPages, 2); p++){
    const page = await pdf.getPage(p); const vp = page.getViewport({scale:2});
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
    all += '\n' + await ocrImage(c, onProg, 'Page ' + p + ': ');
  }
  return {text:all, method:'OCR (scanned PDF)'};
}
let busy = false;
async function handleFile(file){
  if (!file || busy) return;
  busy = true;
  const box = $('#upProg');
  const setP = (msg, p) => { if (!box) return; box.hidden = false; $('#upMsg').textContent = msg; $('#upFill').style.width = Math.round(Math.max(.03, Math.min(1, p)) * 100) + '%'; };
  setP('Reading ' + file.name + '…', 0.02);
  let text = '', method = '', err = '';
  try { const r = await readFileText(file, setP); text = r.text || ''; method = r.method; setP('Done', 1); }
  catch (e) { err = (e && e.message) || 'Could not read this file'; }
  busy = false; if (box) box.hidden = true;
  if (!err && text.replace(/\s/g, '').length < 10) err = 'No readable text was found in this file.';
  let parsed;
  const kind = ui.upKind === 'auto' ? (isPayslip(text) ? 'payslip' : 'receipt') : ui.upKind;
  parsed = kind === 'payslip' ? parsePayslip(text) : parseReceipt(text);
  openTxForm(null, {parsed, raw:text, method, err, sourceFile:file.name, fromFile:true});
}

function render(){
  if (!S) return;
  if (!ui.month) ui.month = curYM();
  const foot = $('#sideFoot');
  if (foot) foot.innerHTML = API.mode === 'server'
    ? `Signed in as <b>${esc(API.email)}</b><br><span id="syncStatus" data-state="${API.sync}"></span>`
    : `Your data stays in this browser only. Back it up from <i>Settings &amp; Backup</i> regularly.`;
  if (API.mode === 'server') setSync(API.sync, API.syncMsg);
  renderNav(); renderMonthPick(); renderBanner();
  $('#pageTitle').textContent = TITLES[ui.tab];
  $('#monthPick').hidden = ui.tab === 'backup';
  destroyCharts();
  const v = $('#view');
  ({dashboard:renderDashboard, bills:renderBills, transactions:renderTransactions, budgets:renderBudgets, backup:renderSettings})[ui.tab](v);
}
function renderNav(){
  const overdue = dueSoon().filter(x => x.st.key === 'overdue').length;
  $('#nav').innerHTML = NAV.map(n => `<button data-tab="${n.id}" ${ui.tab === n.id ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${n.icon}</svg><span>${n.short ? `<span class="lbl-long">${esc(n.label)}</span><span class="lbl-short" hidden>${esc(n.short)}</span>` : esc(n.label)}</span>${n.id === 'bills' && overdue ? `<span class="count" title="${overdue} overdue">${overdue}</span>` : ''}</button>`).join('');
  const narrow = window.matchMedia('(max-width:880px)').matches;
  $$('#nav .lbl-short').forEach(e => e.hidden = !narrow);
}
function renderMonthPick(){
  const cur = curYM();
  const set = new Set([cur, ui.month]);
  for (let k = -11; k <= 1; k++) set.add(addMonths(cur, k));
  S.transactions.forEach(t => t.date && set.add(txMonth(t)));
  const ms = [...set].filter(Boolean).sort().reverse();
  $('#mSel').innerHTML = ms.map(m => `<option value="${m}" ${m === ui.month ? 'selected' : ''}>${monthLabel(m, true)}${m === cur ? ' (this month)' : ''}</option>`).join('');
}
function renderBanner(){
  const b = $('#sampleBanner');
  const parts = [];
  if (!storageOk) parts.push(`<div class="note bad" style="margin-bottom:12px">This browser is blocking storage, so changes will be lost when you close the page. Export a backup from Settings &amp; Backup before leaving.</div>`);
  if (S.hasSample) parts.push(`<div class="note" style="margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:200px"><b>You're looking at example data</b> for a fictional salaried worker in Selangor, so every screen shows how it works. Clear it when you're ready to add your own.</span><button class="btn sm" data-act="clear-sample">Clear sample data</button></div>`);
  b.innerHTML = parts.join(''); b.hidden = !parts.length;
}
function dueStripHTML(){
  const items = dueSoon();
  if (!items.length) return `<div class="due"><div class="due-ok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l5 5 9-10"/></svg>Nothing due in the next 7 days and nothing overdue.</div></div>`;
  const od = items.filter(x => x.st.key === 'overdue').length;
  return `<div class="due" role="region" aria-label="Bills due soon"><div class="due-lead"><span class="eyebrow">Due soon</span><b>${items.length} bill${items.length > 1 ? 's' : ''}</b><span class="hint">${od ? od + ' overdue' : 'next 7 days'}</span></div>` +
    items.map(({b, m, st}) => `<div class="due-item ${st.key}"><div class="top"><span class="nm">${esc(b.name)}</span></div><div class="top"><span class="badge b-${st.key}">${esc(st.label)}</span><b class="tnum">${b.isVariable ? '≈ ' : ''}${money(b.amount)}</b></div><div class="top"><span class="hint">${fmtDate(toISO(st.due))}</span><button class="btn sm" data-act="pay" data-id="${b.id}" data-m="${m}">Mark paid</button></div></div>`).join('') + `</div>`;
}

/* ---- dashboard ---- */
function pctChange(a, b){ if (!b) return null; return (a - b) / Math.abs(b) * 100; }
function renderDashboard(v){
  const m = ui.month, T = monthTotals(m), P = monthTotals(addMonths(m, -1));
  const rate = T.income ? T.saved / T.income * 100 : 0;
  const delta = (a, b, upGood) => { const p = pctChange(a, b); if (p == null) return '<span class="d">No data last month</span>'; const good = upGood ? p >= 0 : p <= 0; return `<span class="d"><b class="${good ? 'pos' : 'neg'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p).toFixed(0)}%</b> vs ${MN[parseISO(addMonths(m, -1) + '-01').getMonth()]}</span>`; };
  const over = budgetRows(m).filter(r => r.state !== 'ok');
  let html = dueStripHTML();
  html += `<div class="kpis">
    <div class="kpi"><span class="eyebrow">Total income</span><span class="v">${money(T.income)}</span>${delta(T.income, P.income, true)}</div>
    <div class="kpi"><span class="eyebrow">Total bills</span><span class="v">${money(T.bills)}</span>${delta(T.bills, P.bills, false)}</div>
    <div class="kpi"><span class="eyebrow">Other spending</span><span class="v">${money(T.other)}</span>${delta(T.other, P.other, false)}</div>
    <div class="kpi"><span class="eyebrow">Saved</span><span class="v">${money(T.saved)}</span><span class="d">${rate.toFixed(1)}% of income</span></div>
    <div class="kpi net ${T.net < 0 ? 'negative' : ''}"><span class="eyebrow">Net cashflow</span><span class="v">${money(T.net, {sign:true})}</span><span class="d">Left after bills, spending &amp; savings</span></div>
  </div>`;
  if (over.length) html += `<div class="alerts">` + over.map(r => `<div class="alert ${r.state === 'over' ? 'bad' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/></svg><span><b>${esc(r.c)}</b> ${r.state === 'over' ? 'is over budget' : 'is close to its limit'}: ${money(r.spent)} of ${money(r.lim)} (${r.pct.toFixed(0)}%)${r.state === 'over' ? ', ' + money(r.spent - r.lim) + ' over' : ''}.</span></div>`).join('') + `</div>`;
  // statement
  const rowsOf = (o, cls = 'sub') => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, a]) => `<tr class="${cls}"><td>${esc(k)}</td><td>${money(a)}</td></tr>`).join('');
  const stmt = `<table class="stmt">
    <tr class="sec"><td colspan="2">Money in</td></tr>
    ${rowsOf(T.incomeBySource) || '<tr class="sub"><td>No income recorded</td><td>—</td></tr>'}
    <tr class="tot"><td>Total income</td><td>${money(T.income)}</td></tr>
    <tr class="sec"><td colspan="2">Money out</td></tr>
    <tr class="grp"><td>Bills</td><td>${money(T.bills)}</td></tr>${rowsOf(T.billsByCat)}
    <tr class="grp"><td>Other spending</td><td>${money(T.other)}</td></tr>${rowsOf(T.otherByCat)}
    <tr class="grp"><td>Savings transfers</td><td>${money(T.saved)}</td></tr>${rowsOf(T.savByGoal)}
    <tr class="tot"><td>Total out</td><td>${money(T.bills + T.other + T.saved)}</td></tr>
    <tr class="net"><td>Net cashflow</td><td class="${T.net < 0 ? 'neg' : 'pos'}">${money(T.net, {sign:true})}</td></tr>
  </table>`;
  // category bars
  const cats = Object.entries(T.byCat).sort((a, b) => b[1] - a[1]);
  const maxC = cats.length ? cats[0][1] : 0;
  const bars = cats.length ? `<div class="bars">` + cats.map(([c, a]) => `<div class="bar-row" title="${esc(c)}: ${money(a)}"><span class="lbl">${esc(c)}</span><div class="track"><div class="fill" style="width:${(a / maxC * 100).toFixed(1)}%"></div></div><span class="val">${money(a)} <span class="muted" style="font-weight:400">${(a / T.spending * 100).toFixed(0)}%</span></span></div>`).join('') + `</div>` : `<div class="empty">No spending recorded for ${monthLabel(m, true)}.</div>`;
  // compare
  const prevM = addMonths(m, -1);
  const prate = P.income ? P.saved / P.income * 100 : 0;
  const incs = Object.keys(Object.assign({}, T.byCat, P.byCat)).map(c => [c, round2((T.byCat[c] || 0) - (P.byCat[c] || 0))]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const dec = Object.keys(Object.assign({}, T.byCat, P.byCat)).map(c => [c, round2((T.byCat[c] || 0) - (P.byCat[c] || 0))]).filter(x => x[1] < 0).sort((a, b) => a[1] - b[1])[0];
  const ins = [];
  const hasPrev = P.income || P.spending || P.saved;
  if (!hasPrev) ins.push(`No transactions in ${monthLabel(prevM, true)} to compare with yet.`);
  else {
    incs.forEach(([c, d]) => ins.push(`You spent <b>${money(d)}</b> more on ${esc(c)} than last month.`));
    if (dec) ins.push(`${esc(dec[0])} came down by <b>${money(-dec[1])}</b>.`);
    const dSp = round2(T.spending - P.spending);
    ins.push(dSp > 0 ? `Total spending is up ${money(dSp)} on ${monthLabel(prevM)}.` : dSp < 0 ? `Total spending is down ${money(-dSp)} on ${monthLabel(prevM)}.` : `Total spending is level with ${monthLabel(prevM)}.`);
    if (T.income) ins.push(rate >= prate ? `Your savings rate rose to ${rate.toFixed(1)}% (from ${prate.toFixed(1)}%).` : `Your savings rate slipped to ${rate.toFixed(1)}% (from ${prate.toFixed(1)}%).`);
  }
  if (m === curYM()) ins.push(`This month is still running, so totals will keep changing until ${fmtShort(m + '-' + daysInMonth(m))}.`);
  const dl = (a, b, upGood) => { const d = round2(a - b); if (!hasPrev) return ''; const good = upGood ? d >= 0 : d <= 0; return `<span class="dl ${good ? 'pos' : 'neg'}">${d >= 0 ? '+' : '−'}${money(Math.abs(d)).replace(/^−/, '')}</span>`; };
  const cmp = `<div class="cmp">
    <div><div class="eyebrow">Income</div><div class="v">${money(T.income)}</div>${dl(T.income, P.income, true)}</div>
    <div><div class="eyebrow">Spending</div><div class="v">${money(T.spending)}</div>${dl(T.spending, P.spending, false)}</div>
    <div><div class="eyebrow">Savings rate</div><div class="v">${rate.toFixed(1)}%</div>${hasPrev ? `<span class="dl ${rate >= prate ? 'pos' : 'neg'}">${rate >= prate ? '+' : '−'}${Math.abs(rate - prate).toFixed(1)} pts</span>` : ''}</div>
  </div>
  ${incs.length ? `<div class="eyebrow" style="margin-bottom:6px">Biggest increases</div><div class="row" style="margin-bottom:14px">${incs.map(([c, d]) => `<span class="chip">${esc(c)} <span class="neg">+${money(d)}</span></span>`).join('')}</div>` : ''}
  <ul class="insights">${ins.map(s => `<li><span>${s}</span></li>`).join('')}</ul>`;
  // trend
  const ms = [5,4,3,2,1,0].map(k => addMonths(m, -k)); const TT = ms.map(monthTotals);
  const trendTable = `<div class="tablewrap"><table class="t"><thead><tr><th>Month</th><th class="r">Income</th><th class="r">Spending</th><th class="r">Saved</th></tr></thead><tbody>${ms.map((mm, i) => `<tr><td>${monthLabel(mm)}</td><td class="amt">${money(TT[i].income)}</td><td class="amt">${money(TT[i].spending)}</td><td class="amt">${money(TT[i].saved)}</td></tr>`).join('')}</tbody></table></div>`;
  html += `<div class="grid-wide" style="margin-bottom:18px">
    <section class="panel"><div class="panel-h"><h2>Cashflow statement</h2><span class="muted">${monthLabel(m, true)}</span></div>${stmt}</section>
    <section class="panel"><div class="panel-h"><h2>Spending by category</h2><span class="muted">${money(T.spending)} total</span></div>${bars}</section>
  </div>
  <div class="grid-wide">
    <section class="panel"><div class="panel-h"><h2>6-month trend</h2><div class="legend"><span><i style="background:var(--s1)"></i>Income</span><span><i style="background:var(--s2)"></i>Spending</span><span><i style="background:var(--s3)"></i>Saved</span></div></div>
      <div class="chart-box" id="trendBox"><canvas id="trend" aria-label="Income, spending and savings over the last six months" role="img"></canvas></div>
      <details class="raw" style="margin-top:10px" id="trendTblWrap"><summary>Show as table</summary>${trendTable}</details>
    </section>
    <section class="panel"><div class="panel-h"><h2>Compared with ${monthLabel(prevM)}</h2></div>${cmp}</section>
  </div>`;
  v.innerHTML = html;
  drawTrend(ms, TT);
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawTrend(ms, TT){
  const box = $('#trendBox');
  if (!window.Chart) { box.innerHTML = `<div class="note">Charts need an internet connection to load. Here are the figures instead.</div>`; $('#trendTblWrap').open = true; return; }
  const ink = cssVar('--muted'), grid = cssVar('--line');
  const ds = (label, key, col) => ({label, data:TT.map(t => t[key]), backgroundColor:col, borderColor:col, borderRadius:4, borderSkipped:'bottom', maxBarThickness:22, categoryPercentage:.7, barPercentage:.9});
  const savedCol = cssVar('--s3');
  try {
    charts.push(new Chart($('#trend'), {
      type:'bar',
      data:{labels:ms.map(x => monthLabel(x)), datasets:[ds('Income', 'income', cssVar('--s1')), ds('Spending', 'spending', cssVar('--s2')),
        {type:'line', label:'Saved', data:TT.map(t => t.saved), borderColor:savedCol, backgroundColor:savedCol, borderWidth:2, pointRadius:4, pointHoverRadius:6, pointBackgroundColor:savedCol, pointBorderColor:cssVar('--surface'), pointBorderWidth:2, tension:.25}]},
      options:{responsive:true, maintainAspectRatio:false, animation:{duration:window.matchMedia('(prefers-reduced-motion:reduce)').matches ? 0 : 400},
        interaction:{mode:'index', intersect:false},
        plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => ' ' + c.dataset.label + ': ' + money(c.parsed.y)}}},
        scales:{x:{grid:{display:false}, ticks:{color:ink, font:{family:'Instrument Sans'}}, border:{color:grid}},
          y:{beginAtZero:true, grid:{color:grid}, border:{display:false}, ticks:{color:ink, font:{family:'Instrument Sans'}, callback:v => (S.settings.currency) + ' ' + (v >= 1000 ? (v / 1000) + 'k' : v)}}}}
    }));
  } catch (e) { box.innerHTML = `<div class="note">The chart couldn't be drawn. The table below has the same figures.</div>`; $('#trendTblWrap').open = true; }
}

/* ---- bills ---- */
function renderBills(v){
  const m = ui.month;
  const list = S.bills.filter(b => billDueIn(b, m)).map(b => ({b, st:billStatus(b, m)})).sort((a, b) => a.st.due - b.st.due);
  const paid = list.filter(x => x.st.key === 'paid');
  const paidAmt = sum(paid.map(x => x.st.pay.actualAmount));
  const remAmt = sum(list.filter(x => x.st.key !== 'paid').map(x => x.b.amount));
  const notDue = S.bills.filter(b => !billDueIn(b, m));
  let html = dueStripHTML();
  html += `<section class="panel"><div class="panel-h"><h2>${monthLabel(m, true)}</h2><span class="ink2">${paid.length} of ${list.length} paid · <b class="tnum">${money(paidAmt)}</b> paid · <b class="tnum">${money(remAmt)}</b> still to pay</span><button class="btn primary" data-act="add-bill">+ Add bill</button></div>`;
  if (!S.bills.length) html += `<div class="empty">No bills yet. Add each recurring bill once (rent, TNB, Unifi, car loan…) and it will appear here every month as unpaid until you mark it paid.</div>`;
  else if (!list.length) html += `<div class="empty">No bills fall due in ${monthLabel(m, true)}.</div>`;
  else html += `<div class="tablewrap"><table class="t"><thead><tr><th>Bill</th><th>Due</th><th class="r">Amount</th><th>Status</th><th class="r">Actions</th></tr></thead><tbody>` +
    list.map(({b, st}) => `<tr>
      <td><div class="cell-title">${esc(b.name)}</div><div class="cell-sub">${esc(b.category)} · ${b.frequency === 'monthly' ? 'Monthly' : b.frequency === 'quarterly' ? 'Every 3 months' : 'Yearly'}${b.isVariable ? ' · variable' : ''}</div></td>
      <td class="tnum">${fmtDate(toISO(st.due))}</td>
      <td class="amt">${st.pay ? money(st.pay.actualAmount) : (b.isVariable ? '≈ ' : '') + money(b.amount)}${st.pay && st.pay.actualAmount !== b.amount ? `<div class="cell-sub">${b.isVariable ? 'est.' : 'set'} ${money(b.amount)}</div>` : ''}</td>
      <td><span class="badge b-${st.key}">${esc(st.label)}</span>${st.pay ? `<div class="cell-sub">${st.pay.beforeTracking ? 'before tracking began' : 'on ' + fmtShort(st.pay.paidDate)}</div>` : ''}</td>
      <td class="r" style="white-space:nowrap">${st.pay ? `<button class="btn sm ghost" data-act="unpay" data-id="${b.id}" data-m="${m}">Undo</button>` : `<button class="btn sm primary" data-act="pay" data-id="${b.id}" data-m="${m}">Mark as paid</button>`}
        <button class="btn sm ghost" data-act="edit-bill" data-id="${b.id}">Edit</button></td></tr>`).join('') + `</tbody></table></div>`;
  if (notDue.length) html += `<p class="hint" style="margin:14px 0 0">Not due this month: ${notDue.map(b => esc(b.name)).join(', ')}.</p>`;
  html += `</section>`;
  v.innerHTML = html;
}

/* ---- transactions ---- */
function renderTransactions(v){
  const f = ui.f;
  const fm = f.month === 'sel' ? ui.month : f.month;
  const q = f.q.trim().toLowerCase();
  let rows = S.transactions.filter(t => (fm === 'all' || txMonth(t) === fm) && (f.type === 'all' || t.type === f.type) && (f.cat === 'all' || t.category === f.cat) &&
    (!q || [t.merchant, t.reference, t.notes, t.category, t.sourceFile, String(t.amount)].join(' ').toLowerCase().includes(q)));
  rows.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || '').localeCompare(a.createdAt || ''));
  const months = [...new Set(S.transactions.map(txMonth))].filter(Boolean).sort().reverse();
  const allCats = [...S.categories, ...INCOME_CATS, 'Savings'];
  const tIn = sum(rows.filter(t => t.type === 'income').map(t => t.amount)), tOut = sum(rows.filter(t => t.type === 'expense').map(t => t.amount));
  v.innerHTML = `<section class="panel" style="margin-bottom:18px">
    <div class="panel-h"><h2>Add from a receipt or payslip</h2>
      <div class="seg" role="group" aria-label="Document type">${[['auto','Auto-detect'],['receipt','Receipt'],['payslip','Payslip']].map(([k, l]) => `<button data-act="upkind" data-k="${k}" aria-pressed="${ui.upKind === k}">${l}</button>`).join('')}</div>
      <button class="btn" data-act="manual">+ Manual entry</button></div>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Upload a receipt or payslip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <b>Drop a PNG, JPG or PDF here, or click to choose a file</b>
      <span class="hint">Bank transfer and DuitNow receipts, e-wallet payments, bill confirmations, payslips. Read on this device; nothing is uploaded anywhere. You'll check every field before it's saved.</span>
    </div>
    <div class="progress" id="upProg" hidden><div class="row"><span id="upMsg" class="ink2" style="font-size:.86rem">Working…</span></div><div class="track"><div class="fill" id="upFill" style="width:3%"></div></div></div>
  </section>
  <section class="panel">
    <div class="panel-h"><h2>All transactions</h2><span class="ink2 tnum">${rows.length} shown · in ${money(tIn)} · out ${money(tOut)}</span></div>
    <div class="filters">
      <input class="in" id="fQ" type="search" placeholder="Search payee, reference, notes…" value="${esc(f.q)}" aria-label="Search">
      <select class="in" id="fM" aria-label="Month"><option value="sel" ${f.month === 'sel' ? 'selected' : ''}>${monthLabel(ui.month)} (selected)</option><option value="all" ${f.month === 'all' ? 'selected' : ''}>All months</option>${months.map(mm => `<option value="${mm}" ${f.month === mm ? 'selected' : ''}>${monthLabel(mm)}</option>`).join('')}</select>
      <select class="in" id="fT" aria-label="Type">${[['all','All types'],['income','Income'],['expense','Expenses'],['savings','Savings']].map(([k, l]) => `<option value="${k}" ${f.type === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <select class="in" id="fC" aria-label="Category"><option value="all">All categories</option>${allCats.map(c => `<option ${f.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
    </div>
    ${rows.length ? `<div class="tablewrap"><table class="t"><thead><tr><th>Date</th><th>Payee / source</th><th>Category</th><th class="r">Amount</th><th class="r"><span class="sr">Actions</span></th></tr></thead><tbody>${rows.map(txRow).join('')}</tbody></table></div>` : `<div class="empty">No transactions match. Upload a receipt above or add one manually.</div>`}
  </section>`;
}
function txRow(t){
  const bill = t.billId && S.bills.find(b => b.id === t.billId);
  const goal = t.goalId && S.goals.find(g => g.id === t.goalId);
  const sub = [t.reference && 'Ref ' + esc(t.reference), bill && 'Bill: ' + esc(bill.name), goal && 'Goal: ' + esc(goal.name), t.sourceFile && '📎 ' + esc(t.sourceFile)].filter(Boolean).join(' · ');
  const cls = t.type === 'income' ? 'amt-in' : t.type === 'savings' ? 'amt-sav' : 'amt-out';
  const sign = t.type === 'income' ? '+' : t.type === 'savings' ? '→ ' : '−';
  return `<tr><td class="tnum" style="white-space:nowrap">${t.date ? fmtDate(t.date) : '—'}</td>
    <td><div class="cell-title">${esc(t.merchant || (t.type === 'savings' ? 'Savings transfer' : '—'))}</div>${sub ? `<div class="cell-sub">${sub}</div>` : ''}</td>
    <td><span class="chip">${esc(t.category || 'Other')}</span></td>
    <td class="amt ${cls}">${sign}${money(t.amount).replace(/^−/, '')}</td>
    <td class="r" style="white-space:nowrap"><button class="btn sm ghost" data-act="edit-tx" data-id="${t.id}">Edit</button><button class="btn sm ghost danger" data-act="del-tx" data-id="${t.id}">Delete</button></td></tr>`;
}

/* ---- budgets & goals ---- */
function renderBudgets(v){
  const m = ui.month;
  const lastNet = (() => { const sl = S.transactions.filter(t => t.type === 'income' && t.category === 'Salary').sort((a, b) => b.date.localeCompare(a.date))[0]; return sl ? sl.amount : 0; })();
  const goalsHTML = S.goals.length ? `<div class="goals">${S.goals.map(g => {
    const saved = goalSaved(g), pct = g.target ? Math.min(100, saved / g.target * 100) : 0, rem = round2(g.target - saved), rate = goalRate(g);
    let eta = '';
    if (rem <= 0) eta = '<b class="pos">Goal reached</b>';
    else if (rate > 0) { const n = Math.ceil(rem / rate); eta = `About <b>${n} month${n > 1 ? 's' : ''}</b> to go at ${money(rate)}/month (around ${monthLabel(addMonths(curYM(), n))}).`; }
    else eta = 'No savings toward this goal in the last 3 months, so there’s no estimate yet.';
    return `<div class="goal"><div class="row"><h3 style="flex:1">${esc(g.name)}</h3><button class="btn sm ghost" data-act="edit-goal" data-id="${g.id}">Edit</button></div>
      <div><span class="big">${money(saved)}</span> <span class="muted">of ${money(g.target)}</span></div>
      <div class="track"><div class="fill good" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="hint" style="font-size:.84rem">${pct.toFixed(0)}% · ${eta}</div>
      <div><button class="btn sm" data-act="contrib" data-id="${g.id}">+ Add savings</button></div></div>`;
  }).join('')}</div>` : `<div class="empty">No goals yet. Try an emergency fund of three to six months of expenses.</div>`;
  const rows = S.categories.map(c => {
    const spent = catSpend(m, c), lim = +S.budgets[c] || 0, pct = lim ? spent / lim * 100 : 0;
    const st = !lim ? '' : pct >= 100 ? 'over' : pct >= 80 ? 'warn' : '';
    return `<div class="budget"><div class="bt"><b>${esc(c)}</b><span class="tnum">${money(spent)}${lim ? ` <span class="muted">of ${money(lim)}</span>` : ''} ${st ? `<span class="state ${st}">${st === 'over' ? 'Over by ' + money(spent - lim) : pct.toFixed(0) + '% used'}</span>` : ''}</span></div>
      <div class="track">${lim ? `<div class="fill ${st}" style="width:${Math.min(100, pct).toFixed(1)}%"></div>` : ''}</div>
      <label class="lim"><span class="hint">Monthly limit</span><input class="in tnum" type="number" min="0" step="10" inputmode="decimal" id="bud-${esc(c).replace(/\W+/g, '_')}" data-budget="${esc(c)}" value="${lim || ''}" placeholder="No limit"></label></div>`;
  }).join('');
  const sm = S.settings;
  v.innerHTML = `<div class="grid-wide">
    <section class="panel"><div class="panel-h"><h2>Budgets for ${monthLabel(m, true)}</h2><span class="hint">Amber at 80%, red at 100%</span></div>${rows}</section>
    <div class="stack">
      <section class="panel"><div class="panel-h"><h2>Pay yourself first</h2></div>
        <p class="ink2" style="margin:0 0 12px;font-size:.9rem">When you save a payslip, Aliran offers to move this amount to savings straight away, before the month's spending starts.</p>
        <div class="form-grid">
          <label class="f">Rule<select class="in" id="svMode"><option value="percent" ${sm.savingsMode === 'percent' ? 'selected' : ''}>Percentage of net pay</option><option value="fixed" ${sm.savingsMode === 'fixed' ? 'selected' : ''}>Fixed amount</option></select></label>
          <label class="f">${sm.savingsMode === 'percent' ? 'Percent of net pay' : 'Amount (' + esc(sm.currency) + ')'}<input class="in tnum" type="number" min="0" step="${sm.savingsMode === 'percent' ? 1 : 10}" id="svVal" value="${sm.savingsMode === 'percent' ? sm.savingsPercent : sm.savingsFixed}"></label>
        </div>
        ${lastNet ? `<p class="hint" style="margin:10px 0 0">On your last net pay of ${money(lastNet)}, that's <b>${money(suggestedSavings(lastNet))}</b> a month.</p>` : ''}
      </section>
      <section class="panel"><div class="panel-h"><h2>Savings goals</h2><button class="btn primary sm" data-act="add-goal">+ New goal</button></div>${goalsHTML}</section>
    </div></div>`;
}
